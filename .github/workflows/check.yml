name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sever-ide/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s sever-ide/backend -p 'test_*.py'
      - run: python scripts/check_release.py
      - run: npm ci
        working-directory: sever-ide
      - run: npm run typecheck && npm run build
        working-directory: sever-ide
